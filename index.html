<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HERO.IO - We Build Productive Apps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #7C3AED;
      --purple-light: #8B5CF6;
      --purple-dark: #5B21B6;
      --green: #10B981;
      --dark-navy: #0F172A;
      --text-dark: #1E293B;
      --text-muted: #64748B;
      --bg: #F1F5F9;
      --white: #FFFFFF;
      --border: #E2E8F0;
      --orange: #F97316;
      --yellow: #F59E0B;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text-dark); }
    h1,h2,h3,h4,h5 { font-family: 'Syne', sans-serif; }

    /* ===== NAVBAR ===== */
    .navbar {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      padding: 0 2rem;
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; cursor: pointer; }
    .logo-img { width: 36px; height: 36px; object-fit: contain; }
    .logo-text { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.1rem; color: var(--text-dark); }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { text-decoration: none; color: var(--text-dark); font-size: 0.95rem; font-weight: 500; padding: 4px 0; border-bottom: 2px solid transparent; transition: all 0.2s; cursor: pointer; }
    .nav-links a.active { color: var(--purple); border-bottom-color: var(--purple); }
    .nav-links a:hover { color: var(--purple); }
    .contribute-btn { background: var(--purple); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-family: 'Syne', sans-serif; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; transition: background 0.2s; text-decoration: none; }
    .contribute-btn:hover { background: var(--purple-dark); }
    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; }
    .hamburger span { width: 24px; height: 2px; background: var(--text-dark); border-radius: 2px; transition: all 0.3s; }

    /* ===== HERO ===== */
    .hero { text-align: center; padding: 60px 2rem 0; background: var(--bg); }
    .hero h1 { font-size: clamp(2.5rem, 5vw, 3.8rem); font-weight: 800; line-height: 1.15; color: var(--text-dark); }
    .hero h1 span { color: var(--purple); }
    .hero p { margin: 1.2rem auto; max-width: 600px; color: var(--text-muted); font-size: 1rem; line-height: 1.7; }
    .hero-btns { display: flex; justify-content: center; gap: 12px; margin-bottom: 40px; flex-wrap: wrap; }
    .btn-store { display: flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 10px; border: 1.5px solid var(--border); background: white; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; color: var(--text-dark); transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
    .btn-store:hover { border-color: var(--purple); box-shadow: 0 4px 12px rgba(124,58,237,0.15); }
    .hero-image-wrapper { max-width: 560px; margin: 0 auto; position: relative; }
    .hero-image-wrapper img.hero-main { width: 100%; border-radius: 0; display: block; }

    /* ===== STATS ===== */
    .stats-section { background: var(--purple); padding: 60px 2rem; text-align: center; }
    .stats-section h2 { color: white; font-size: clamp(1.5rem, 3vw, 2rem); margin-bottom: 48px; font-weight: 800; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); max-width: 800px; margin: 0 auto; gap: 2rem; }
    .stat-card { color: white; }
    .stat-icon { width: 40px; height: 40px; margin: 0 auto 12px; display: block; filter: brightness(0) invert(1); }
    .stat-label { font-size: 0.85rem; opacity: 0.85; margin-bottom: 6px; }
    .stat-value { font-family: 'Syne', sans-serif; font-size: clamp(2rem, 4vw, 3rem); font-weight: 800; }
    .stat-sub { font-size: 0.78rem; opacity: 0.7; margin-top: 6px; }

    /* ===== SECTIONS ===== */
    .section { padding: 80px 2rem; }
    .section-header { text-align: center; margin-bottom: 40px; }
    .section-header h2 { font-size: clamp(1.8rem, 3vw, 2.4rem); font-weight: 800; }
    .section-header p { color: var(--text-muted); margin-top: 10px; }
    .container { max-width: 1200px; margin: 0 auto; }

    /* ===== APP CARDS ===== */
    .apps-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    .app-card { background: white; border-radius: 12px; overflow: hidden; cursor: pointer; transition: all 0.25s; border: 1px solid var(--border); }
    .app-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.1); }
    .app-card-img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #e2e8f0; display: block; }
    .app-card-body { padding: 12px; }
    .app-card-title { font-family: 'Syne', sans-serif; font-size: 0.875rem; font-weight: 600; margin-bottom: 8px; line-height: 1.3; color: var(--text-dark); }
    .app-card-meta { display: flex; justify-content: space-between; align-items: center; }
    .meta-downloads { display: flex; align-items: center; gap: 4px; color: var(--green); font-size: 0.8rem; font-weight: 600; }
    .meta-downloads img { width: 13px; height: 13px; }
    .meta-rating { display: flex; align-items: center; gap: 4px; color: var(--yellow); font-size: 0.8rem; font-weight: 600; }
    .meta-rating img { width: 13px; height: 13px; }

    /* ===== SHOW ALL ===== */
    .show-all-wrapper { text-align: center; margin-top: 40px; }
    .btn-primary { background: var(--purple); color: white; border: none; padding: 14px 40px; border-radius: 8px; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
    .btn-primary:hover { background: var(--purple-dark); transform: translateY(-1px); box-shadow: 0 8px 20px rgba(124,58,237,0.3); }

    /* ===== ALL APPS PAGE ===== */
    .page-title-section { text-align: center; padding: 60px 2rem 40px; }
    .page-title-section h1 { font-size: clamp(1.8rem, 3.5vw, 2.8rem); font-weight: 800; }
    .page-title-section p { color: var(--text-muted); margin-top: 10px; }
    .all-apps-toolbar { max-width: 1200px; margin: 0 auto 24px; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .apps-count { font-weight: 700; font-family: 'Syne', sans-serif; font-size: 1.1rem; }
    .search-container { position: relative; }
    .search-input { padding: 10px 16px 10px 40px; border: 1.5px solid var(--border); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; outline: none; width: 280px; transition: border-color 0.2s; background: white; }
    .search-input:focus { border-color: var(--purple); }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .sort-dropdown { padding: 10px 16px; border: 1.5px solid var(--border); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; background: white; cursor: pointer; outline: none; color: var(--text-dark); }

    /* ===== APP DETAILS ===== */
    .app-details-wrapper { max-width: 1100px; margin: 0 auto; padding: 60px 2rem; }
    .app-details-top { display: grid; grid-template-columns: 220px 1fr; gap: 48px; align-items: start; padding-bottom: 40px; border-bottom: 1px solid var(--border); margin-bottom: 40px; }
    .app-detail-img { width: 220px; height: 220px; object-fit: cover; border-radius: 20px; border: 1px solid var(--border); }
    .app-detail-info h1 { font-size: clamp(1.4rem, 2.5vw, 1.9rem); font-weight: 800; margin-bottom: 4px; }
    .app-detail-company { color: var(--purple); font-weight: 600; font-size: 0.95rem; margin-bottom: 24px; }
    .app-detail-company span { color: var(--purple); }

    /* Stats row in details - icon + label + value stacked */
    .app-stats-row { display: flex; gap: 40px; flex-wrap: wrap; margin-bottom: 28px; padding-bottom: 28px; border-bottom: 1px solid var(--border); }
    .app-stat-block { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
    .app-stat-icon { width: 28px; height: 28px; object-fit: contain; }
    .app-stat-label { font-size: 0.78rem; color: var(--text-muted); }
    .app-stat-value { font-family: 'Syne', sans-serif; font-size: 1.4rem; font-weight: 800; color: var(--text-dark); }

    .install-btn { background: var(--green); color: white; border: none; padding: 14px 32px; border-radius: 10px; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
    .install-btn:hover:not(:disabled) { background: #059669; transform: translateY(-1px); }
    .install-btn:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }

    /* ===== RATINGS CHART ===== */
    .chart-section { margin-bottom: 40px; padding-bottom: 40px; border-bottom: 1px solid var(--border); }
    .chart-section h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; }
    .rating-chart-container { display: flex; gap: 40px; align-items: flex-end; }
    .rating-bars-horizontal { flex: 1; display: flex; flex-direction: column; gap: 10px; }
    .rating-row { display: flex; align-items: center; gap: 12px; }
    .rating-label { width: 45px; font-size: 0.82rem; color: var(--text-muted); text-align: right; flex-shrink: 0; }
    .rating-bar-track { flex: 1; height: 14px; background: #f1f5f9; border-radius: 4px; overflow: hidden; }
    .rating-bar-fill { height: 100%; background: var(--orange); border-radius: 4px; transition: width 0.8s ease; }
    .rating-axis { display: flex; justify-content: space-between; padding-left: 57px; margin-top: 6px; }
    .rating-axis span { font-size: 0.75rem; color: var(--text-muted); }
    .rating-count-label { width: 50px; font-size: 0.78rem; color: var(--text-muted); flex-shrink: 0; }

    /* ===== DESCRIPTION ===== */
    .desc-section h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 16px; }
    .desc-section p { color: var(--text-muted); line-height: 1.85; font-size: 0.95rem; margin-bottom: 16px; }

    /* ===== INSTALLATION PAGE ===== */
    .installation-list { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    .installed-card { background: white; border-radius: 12px; padding: 20px; display: flex; align-items: center; gap: 16px; border: 1px solid var(--border); }
    .installed-img { width: 72px; height: 72px; border-radius: 12px; object-fit: cover; background: #e2e8f0; flex-shrink: 0; }
    .installed-info { flex: 1; }
    .installed-info h3 { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; margin-bottom: 8px; }
    .installed-meta { display: flex; align-items: center; gap: 16px; }
    .uninstall-btn { background: var(--green); color: white; border: none; padding: 10px 24px; border-radius: 8px; font-family: 'Syne', sans-serif; font-weight: 700; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .uninstall-btn:hover { background: #059669; }

    /* ===== NO APPS ===== */
    .no-apps { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .no-apps h3 { font-family: 'Syne', sans-serif; font-size: 1.3rem; margin-bottom: 8px; }

    /* ===== ERROR PAGES ===== */
    .error-page { min-height: calc(100vh - 64px - 160px); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; }
    .error-page img { width: min(380px, 70vw); margin-bottom: 32px; }
    .error-page h1 { font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 800; margin-bottom: 12px; color: var(--text-dark); }
    .error-page p { color: var(--text-muted); margin-bottom: 28px; max-width: 440px; }

    /* ===== FOOTER ===== */
    footer { background: var(--dark-navy); color: white; padding: 40px 2rem 20px; }
    .footer-top { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; max-width: 1200px; margin-left: auto; margin-right: auto; }
    .footer-logo { display: flex; align-items: center; gap: 8px; }
    .footer-logo-img { width: 32px; height: 32px; object-fit: contain; }
    .footer-logo span { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; }
    .social-links h4 { font-family: 'Syne', sans-serif; font-size: 0.9rem; margin-bottom: 12px; }
    .social-icons { display: flex; gap: 10px; }
    .social-icon { width: 36px; height: 36px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; color: white; text-decoration: none; font-size: 0.8rem; }
    .social-icon:hover { background: var(--purple); }
    .footer-bottom { text-align: center; font-size: 0.85rem; opacity: 0.6; padding-top: 4px; }

    /* ===== TOAST ===== */
    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { background: var(--text-dark); color: white; padding: 14px 20px; border-radius: 10px; font-size: 0.9rem; font-family: 'DM Sans', sans-serif; box-shadow: 0 8px 24px rgba(0,0,0,0.2); animation: slideIn 0.3s ease; display: flex; align-items: center; gap: 10px; min-width: 260px; }
    .toast.success { border-left: 4px solid var(--green); }
    .toast.error { border-left: 4px solid #ef4444; }
    @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(120%); opacity: 0; } }
    .toast.hide { animation: slideOut 0.3s ease forwards; }

    /* ===== LOADING ===== */
    .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; z-index: 999; backdrop-filter: blur(4px); }
    .spinner { width: 48px; height: 48px; border: 4px solid var(--border); border-top-color: var(--purple); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1024px) { .apps-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 768px) {
      .apps-grid { grid-template-columns: repeat(2, 1fr); }
      .app-details-top { grid-template-columns: 1fr; }
      .app-detail-img { width: 140px; height: 140px; }
      .stats-grid { grid-template-columns: 1fr; gap: 1.5rem; }
      .nav-links { display: none; flex-direction: column; position: absolute; top: 64px; left: 0; right: 0; background: white; padding: 1rem 2rem; border-bottom: 1px solid var(--border); gap: 1rem; z-index: 99; }
      .nav-links.open { display: flex; }
      .hamburger { display: flex; }
      .footer-top { flex-direction: column; gap: 20px; }
      .search-input { width: 220px; }
      .rating-chart-container { flex-direction: column; }
    }
    @media (max-width: 480px) {
      .apps-grid { grid-template-columns: repeat(2, 1fr); }
      .hero h1 { font-size: 2rem; }
      .search-input { width: 180px; }
      .navbar { padding: 0 1rem; }
    }
  </style>
</head>

let installedApps = JSON.parse(localStorage.getItem('heroio_installed') || '[]');
let searchQuery = '';
let sortOrder = '';
let isLoading = false;

// ===== HELPERS =====
const formatNum = n => n >= 1000000 ? (n/1000000).toFixed(0)+'M' : n >= 1000 ? (n/1000).toFixed(0)+'K' : n;
const isInstalled = id => installedApps.some(a => a.id === id);

function saveInstalled() {
  localStorage.setItem('heroio_installed', JSON.stringify(installedApps));
}

function showToast(msg, type='success') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span><span>${msg}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('hide');
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

function navigate(page, appId=null) {
  isLoading = true;
  render();
  setTimeout(() => {
    currentPage = page;
    currentAppId = appId;
    isLoading = false;
    searchQuery = '';
    sortOrder = '';
    navOpen = false;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }, 400);
}

function handleInstall(id) {
  const app = appsData.find(a => a.id === id);
  if (!app || isInstalled(id)) return;
  installedApps.push(app);
  saveInstalled();
  const btn = document.getElementById(`install-btn-${id}`);
  if (btn) { btn.disabled = true; btn.textContent = `Installed (${app.size} MB)`; }
  showToast(`${app.title} installed successfully!`, 'success');
}

function renderInstallation() {
  return `
  <div class="page-title-section">
    <h1>Your Installed Apps</h1>
    <p>Explore All Trending Apps on the Market developed by us</p>
  </div>
  <div style="max-width:900px;margin:0 auto;padding:0 2rem 80px;">

        <option value="">Sort By Size</option>
        <option value="size-high">High to Low</option>
        <option value="size-low">Low to High</option>
      </select>
    </div>
    <div class="installation-list" id="installation-list">
      ${renderInstalledList(installedApps)}

}

function renderInstalledList(list) {
  if (list.length === 0) return `<div class="no-apps"><h3>No Apps Installed</h3><p>Go to the <a href="#" onclick="navigate('apps')" style="color:var(--purple);text-decoration:none;font-weight:600;">Apps page</a> to install some apps.</p></div>`;
  return list.map(app => `
    <div class="installed-card" id="installed-${app.id}">
      <img class="installed-img" src="${app.image}" alt="${app.title}" onerror="this.src='https://placehold.co/72x72/e2e8f0/94a3b8?text=App'"/>
      <div class="installed-info">
        <h3>${app.title}</h3>
        <div class="installed-meta">
          <span class="meta-downloads">
            <img src="icon-downloads.png" alt="" style="width:13px;height:13px;" onerror="this.style.display='none'"/>
            ${formatNum(app.downloads)}
          </span>
          <span class="meta-rating">
            <img src="icon-ratings.png" alt="" style="width:13px;height:13px;" onerror="this.style.display='none'"/>
            ${app.ratingAvg}
          </span>
          <span style="color:#64748b;font-size:0.85rem;">${app.size} MB</span>
        </div>
      </div>
      <button class="uninstall-btn" onclick="handleUninstall(${app.id})">Uninstall</button>
    </div>`).join('');
}

function handleInstallSort(val) {
  let sorted = [...installedApps];
  if (val === 'size-high') sorted.sort((a,b) => b.size - a.size);
  if (val === 'size-low') sorted.sort((a,b) => a.size - b.size);
  document.getElementById('installation-list').innerHTML = renderInstalledList(sorted);
}

function handleUninstall(id) {
  const app = installedApps.find(a => a.id === id);
  installedApps = installedApps.filter(a => a.id !== id);
  saveInstalled();
  const el = document.getElementById(`installed-${id}`);
  if (el) { el.style.opacity='0'; el.style.transform='translateX(20px)'; el.style.transition='all 0.3s'; setTimeout(()=>el.remove(),300); }
  document.querySelector('.apps-count').textContent = `${installedApps.length} Apps Found`;
  if (app) showToast(`${app.title} uninstalled.`, 'error');
}

    <button class="btn-primary" onclick="navigate('home')">Go Back!</button>
  </div>`;
}

function renderAppNotFound() {
  return `
  <div class="error-page">
    <img src="App-Error.png" alt="Not Found" onerror="this.src='https://placehold.co/380x320/fff9e6/f97316?text=NOT+FOUND'"/>
    <h1>OPPS!! APP NOT FOUND</h1>
    <p>The App you are requesting is not found on our system. Please try another apps</p>
    <button class="btn-primary" onclick="navigate('apps')">Go Back!</button>
  </div>`;
}

// ===== MAIN RENDER =====
function render() {
  const appEl = document.getElementById('app');
  let content = '';

  if (isLoading) {
    appEl.innerHTML = `
      ${renderNavbar()}
      <div class="loading-overlay"><div class="spinner"></div></div>
      ${renderFooter()}
    `;
    return;
  }

  switch(currentPage) {
    case 'home':         content = renderHome(); break;
    case 'apps':         content = renderApps(); break;
    case 'details':      content = renderDetails(); break;
    case 'installation': content = renderInstallation(); break;
    default:             content = renderError404();
  }

  appEl.innerHTML = `
    ${renderNavbar()}
    <main id="main-content" style="min-height:calc(100vh - 64px - 160px);transition:opacity 0.2s;">${content}</main>
    ${renderFooter()}
  `;
}

window.addEventListener('popstate', () => render());

document.addEventListener('DOMContentLoaded', () => {
  const tc = document.createElement('div');
  tc.id = 'toast-container';
  tc.className = 'toast-container';
  document.body.appendChild(tc);
  render();
});
</script>
</body>
</html>
